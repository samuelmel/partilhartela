<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Probe de captura</title>
  <style>
    body { font-family: monospace; background: #111; color: #ddd; padding: 20px; }
    .ok { color: #4ade80; }
    .fail { color: #f87171; }
    .skip { color: #fbbf24; }
    h2 { color: #60a5fa; }
  </style>
</head>
<body>
  <h2>Probe de captura de tela</h2>
  <pre id="out"></pre>

  <script>
    const out = document.getElementById('out');
    function log(msg, cls) {
      const line = document.createElement('div');
      line.className = cls || '';
      line.textContent = msg;
      out.appendChild(line);
      // Reporta ao main por IPC: stdout do Electron nao e capturado no Windows.
      window.probeAPI.report({ type: 'LOG', msg: msg });
    }

    window.probeSetCurrent = (name) =>
      window.probeAPI.report({ type: 'START', test: name });

    const VIDEO_CONSTRAINTS = (id) => ({
      mandatory: {
        chromeMediaSource: 'desktop',
        chromeMediaSourceId: id,
        maxWidth: 1920,
        maxHeight: 1080,
        maxFrameRate: 60
      }
    });

    const AUDIO_ONLY = {
      audio: { mandatory: { chromeMediaSource: 'desktop' } },
      video: false
    };

    function stopAll(stream) {
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
    }

    async function test(name, fn) {
      window.probeSetCurrent(name);
      log('--- iniciando: ' + name + ' ---');
      try {
        const stream = await fn();
        const v = stream.getVideoTracks();
        const a = stream.getAudioTracks();

        // Rotulo e settings revelam a ORIGEM real da track de audio:
        // loopback global costuma vir como "System Audio"/"Audio de sistema",
        // enquanto audio de janela vem com o nome da janela.
        log('OK   ' + name + ' -> video=' + v.length + ' audio=' + a.length, 'ok');
        if (a.length) {
          log('       audio label = "' + a[0].label + '"');
          log('       audio settings = ' + JSON.stringify(a[0].getSettings()));
        }
        if (v.length) {
          log('       video label = "' + v[0].label + '"');
        }
        stopAll(stream);
      } catch (err) {
        log('FALHA ' + name + ' -> ' + err.name + ': ' + err.message, 'fail');
      }
      await new Promise(r => setTimeout(r, 800));
    }

    window.addEventListener('load', async () => {
      let sources = [];
      try {
        sources = await window.probeAPI.getSources();
        log('fontes recebidas: ' + sources.length);
      } catch (err) {
        log('falha ao listar fontes: ' + err.message, 'fail');
        return;
      }

      const screen = sources.find(s => s.isScreen);
      const win1 = sources.find(s => !s.isScreen);

      log('screen: ' + (screen ? screen.name : 'nenhum'));
      log('janela: ' + (win1 ? win1.name : 'nenhuma'));
      log('');
      log('>>> Se o renderer morrer, o teste que estava em curso e o culpado.');
      log('');

      // 1. Somente video (caminho que o app usa no modo nativo)
      if (screen) {
        await test('A) video-only + chromeMediaSourceId',
          () => navigator.mediaDevices.getUserMedia({
            audio: false, video: VIDEO_CONSTRAINTS(screen.id)
          }));
      }

      // 2. Audio + video juntos (caminho do modo janela do app original)
      if (screen) {
        await test('B) audio+video juntos (screen)',
          () => navigator.mediaDevices.getUserMedia({
            audio: { mandatory: { chromeMediaSource: 'desktop' } },
            video: VIDEO_CONSTRAINTS(screen.id)
          }));
      }

      // 3. Audio isolado: DERRUBA o renderer nesta versao do Electron.
      //    O teste fica commented de proposito -- se for descomentado, o
      //    probe vai crashar de proposito e registrar RENDERER_GONE.
      //    Referencia: apps/desktop/js/webrtc.js nunca deve chamar
      //    getUserMedia com audio desktop e video:false.
      //
      // await test('C) audio-ONLY (derruba o renderer)',
      //   () => navigator.mediaDevices.getUserMedia({
      //     audio: { mandatory: { chromeMediaSource: 'desktop' } },
      //     video: false
      //   }));

      // 4. getDisplayMedia via handler do Electron: entrega LOOPBACK GLOBAL?
      //    Usa a MESMA fonte ja capturada no teste B para nao duplicar video.
      if (screen) {
        await test('D) getDisplayMedia + handler (loopback global)', async () => {
          await window.probeAPI.setTarget(screen.id);
          return navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: true
          });
        });
      }

      // 5. Video de JANELA + audio amarrado ao SCREEN (loopback global).
      //    E o cenario que a app usa quando o usuario escolhe "Janela do
      //    aplicativo". Se o audio vier com deviceId=loopback aqui, entao
      //    amarrar o audio ao SCREEN (e nao a janela) da audio global.
      if (win1 && screen) {
        await test('E) video=janela, audio=screen', async () => {
          const wv = VIDEO_CONSTRAINTS(win1.id);
          return navigator.mediaDevices.getUserMedia({
            audio: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: screen.id
              }
            },
            video: wv
          });
        });
      }

      // 6. Controle: video=janela + audio=janela (deve ser audio RESTRITO)
      if (win1) {
        await test('F) video=janela, audio=janela (restrito)', async () => {
          const wv = VIDEO_CONSTRAINTS(win1.id);
          return navigator.mediaDevices.getUserMedia({
            audio: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: win1.id
              }
            },
            video: wv
          });
        });
      }

      // ------------------------------------------------------------------
      // FASE 1: MEDICAO DE SINAL DE VERDADE (RMS)
      //
      // Rotulo de track nao prova conteudo: `deviceId: loopback` aparece em
      // qualquer audio de desktop. Aqui medimos o SINAL de verdade com
      // getFloatTimeDomainData + AnalyserNode.
      //
      // Regra critica: nunca pedir audio isolado (video:false) - derruba o
      // renderer. Cada medicao pede audio da fonte + video minimo.
      // ------------------------------------------------------------------
      window.probeSetCurrent('G) medicao de RMS por fonte');
      log('');
      log('=== MEDICAO DE SINAL (RMS) ===');

      const AUDIBLE = 0.0005; // ~ -66 dBFS

      // Tom de teste: garante um sinal conhecido no dispositivo de saida.
      let tone = null;
      try {
        const ToneCtor = window.AudioContext || window.webkitAudioContext;
        const toneCtx = new ToneCtor();
        await toneCtx.resume();
        const osc = toneCtx.createOscillator();
        const gain = toneCtx.createGain();
        osc.frequency.value = 440;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(toneCtx.destination);
        osc.start();
        tone = { ctx: toneCtx, osc: osc };
        log('tom de teste ligado (440Hz, ganho 0.12)');
      } catch (err) {
        log('nao foi possivel iniciar o tom: ' + err.message, 'fail');
      }

      /**
       * Mede o RMS de pico de uma faixa de audio por `ms` milissegundos.
       * O AudioContext e fechado ao final para nao vazar nos realtime.
       */
      async function measureRms(track, ms) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctor();
        try {
          await ctx.resume();

          const source = ctx.createMediaStreamSource(new MediaStream([track]));
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          // Ganho 0 evita eco; sem isto o no pode nao ser processado.
          const mute = ctx.createGain();
          mute.gain.value = 0;
          analyser.connect(mute);
          mute.connect(ctx.destination);

          const buf = new Float32Array(analyser.fftSize);
          let maxRms = 0;
          const deadline = performance.now() + ms;

          while (performance.now() < deadline) {
            analyser.getFloatTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
            const rms = Math.sqrt(sum / buf.length);
            if (rms > maxRms) maxRms = rms;
            await new Promise((r) => setTimeout(r, 50));
          }

          try { source.disconnect(); mute.disconnect(); } catch (e) {}
          return maxRms;
        } finally {
          try { await ctx.close(); } catch (e) {}
        }
      }

      const dbfs = (rms) => (rms > 0 ? (20 * Math.log10(rms)).toFixed(1) : '-inf');
      const candidates = [
        ...(screen ? [screen] : []),
        ...sources.filter((s) => !s.isScreen).slice(0, 8)
      ];

      const measurements = [];

      for (const source of candidates) {
        const label = (source.isScreen ? '[TELA] ' : '[JANELA] ') + source.name;
        let stream = null;
        try {
          // audio da fonte + video minimo (nunca audio isolado)
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: source.id,
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
              }
            },
            video: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: source.id,
                maxWidth: 320,
                maxHeight: 180,
                maxFrameRate: 5
              }
            }
          });

          const track = stream.getAudioTracks()[0];
          if (!track) {
            log('SEM FAIXA DE AUDIO  ' + label, 'skip');
            measurements.push({
              source: source.name, isScreen: source.isScreen,
              hasTrack: false, rms: 0, dbfs: null, audible: false
            });
            continue;
          }

          const rms = await measureRms(track, 1500);
          const settings = track.getSettings();
          const audible = rms > AUDIBLE;

          log((audible ? 'COM SOM  ' : 'SILENCIO ') +
            label + '  rms=' + rms.toFixed(5) + ' (' + dbfs(rms) + ' dBFS)',
            audible ? 'ok' : 'skip');

          measurements.push({
            source: source.name,
            isScreen: source.isScreen,
            hasTrack: true,
            rms: Number(rms.toFixed(6)),
            dbfs: dbfs(rms),
            audible,
            deviceId: settings.deviceId,
            channels: settings.channelCount
          });
        } catch (err) {
          log('FALHOU ' + label + ' -> ' + err.name + ': ' + err.message, 'fail');
          measurements.push({
            source: source.name, isScreen: source.isScreen,
            error: err.name + ': ' + err.message
          });
        } finally {
          if (stream) stopAll(stream);
        }
      }

      if (tone) {
        try { tone.osc.stop(); } catch (e) {}
        try { await tone.ctx.close(); } catch (e) {}
      }

      // Baseline: se a tela nao enxerga o tom, todos os zeros sao
      // inconclusivos (pode ser o tom, nao a fonte).
      const screenMeasurement = measurements.find((m) => m.isScreen);
      const baselineOk = Boolean(screenMeasurement && screenMeasurement.audible);

      log('');
      log('RESULTADO: ' + measurements.length + ' fonte(s) medida(s)');
      log('com som   : ' + measurements.filter((m) => m.audible).length);
      log('silenciosas: ' +
        measurements.filter((m) => m.hasTrack && !m.audible).length);
      log('sem faixa : ' + measurements.filter((m) => !m.hasTrack).length);
      log('baseline (tela enxerga o tom): ' + (baselineOk ? 'SIM' : 'NAO'));
      if (!baselineOk) {
        log('ATENCAO: sem baseline valido os zeros nao sao conclusivos.',
          'fail');
      }

      window.probeAPI.report({ type: 'MEASUREMENTS', data: measurements });
      window.probeAPI.report({ type: 'BASELINE', ok: baselineOk });

      log('');
      log('=== Todos os testes concluidos sem derrubar o renderer ===', 'ok');
      window.probeAPI.report({ type: 'DONE' });
    });
  </script>
</body>
</html>
