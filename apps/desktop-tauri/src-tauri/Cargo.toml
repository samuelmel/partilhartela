[package]
name = "partilhartela-tauri"
version = "2.0.4"
description = "Casca Tauri do PartilharTela (Fase 2: compartilhar tela pelo Rust)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "partilhartela_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
livekit = { version = "0.10.1", features = ["rustls-tls-native-roots"] }
libwebrtc = "0.4.0"
wasapi = "0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
url = "2"
sha2 = "0.10"
rand = "0.8"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
windows = { version = "0.62.2", features = [
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Media",
  "Win32",
  "Win32_Foundation",
  "Win32_Graphics",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Media_MediaFoundation",
  "Win32_System",
  "Win32_System_Com",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_UI",
  "Win32_UI_WindowsAndMessaging",
] }

# Perfil de release pensado para build rápido: sem LTO e com compilação incremental, só o crate do
# app é recompilado a cada mudança (o gargalo era o LTO total reotimizando libwebrtc, livekit e tauri).
# O gargalo de desempenho do app está no codificador do Windows e no libwebrtc, não no Rust.
[profile.release]
codegen-units = 16
incremental = true
lto = false
opt-level = "s"
strip = true
