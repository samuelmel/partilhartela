[package]
name = "partilhartela-tauri"
version = "0.1.0"
description = "Casca Tauri do PartilharTela (Fase 1)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "partilhartela_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
